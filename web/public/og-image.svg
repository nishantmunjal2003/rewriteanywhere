<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="badgeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle glow orb -->
  <circle cx="950" cy="180" r="280" fill="#6366f1" opacity="0.15" filter="blur(60px)" />
  <circle cx="200" cy="480" r="200" fill="#38bdf8" opacity="0.12" filter="blur(60px)" />

  <!-- Border Card -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.6" />

  <!-- Badge -->
  <rect x="90" y="90" width="340" height="42" rx="21" fill="url(#badgeGradient)" />
  <text x="260" y="117" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="1">
    ⚡ NATIVE WINDOWS 10 &amp; 11 APP
  </text>

  <!-- Product Title -->
  <text x="90" y="210" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5">
    AI Rewrite Anywhere
  </text>

  <!-- Gradient Subtitle -->
  <text x="90" y="275" fill="url(#titleGradient)" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700">
    In-Place AI Rewriting in Every Windows Application
  </text>

  <!-- Description -->
  <text x="90" y="340" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">
    Highlight text anywhere • Press Ctrl+Shift+R • Powered by Gemini, OpenAI &amp; Claude
  </text>
  <text x="90" y="375" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">
    No monthly subscriptions • 100% Free Gemini tier supported • $19 Lifetime License
  </text>

  <!-- Features Pills -->
  <g transform="translate(90, 440)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="52" rx="12" fill="#1e293b" stroke="#334155" />
    <text x="110" y="32" fill="#34d399" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">
      ✓ Free Gemini Tier
    </text>

    <!-- Pill 2 -->
    <rect x="240" y="0" width="220" height="52" rx="12" fill="#1e293b" stroke="#334155" />
    <text x="350" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">
      🔒 DPAPI Local Security
    </text>

    <!-- Pill 3 -->
    <rect x="480" y="0" width="240" height="52" rx="12" fill="#1e293b" stroke="#334155" />
    <text x="600" y="32" fill="#facc15" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">
      🛡️ 14-Day Guarantee
    </text>

    <!-- Pill 4 (Price) -->
    <rect x="740" y="0" width="280" height="52" rx="12" fill="#4f46e5" />
    <text x="880" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
      $19 USD / ₹1,600 INR Lifetime
    </text>
  </g>

  <!-- Footer Link -->
  <text x="90" y="550" fill="#64748b" font-family="system-ui, sans-serif" font-size="18" font-weight="500">
    rewriteanywhere.nishantmunjal.com
  </text>
</svg>
